<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#16151b" />
    <meta
      name="description"
      content="Insidia. Un juego de almas, pecados y mentiras para 3 a 6 jugadores."
    />
    <meta property="og:title" content="INSIDIA — Ningún alma es inocente" />
    <meta
      property="og:description"
      content="Reúne a tus cómplices. Oculta tus pecados. Confía en nadie."
    />
    <title>INSIDIA — Ningún alma es inocente</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%2316151b'/%3E%3Cpath d='M32 8 52 32 32 56 12 32Z' stroke='%23d8ba76' stroke-width='2' fill='none'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='32' fill='%23d8ba76' font-family='serif'%3EI%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <link rel="stylesheet" href="/games/insidia/style.css" />
    <div id="stage">
      <canvas
        id="canvas"
        width="1600"
        height="900"
        aria-label="Mesa de juego Insidia"
      ></canvas>
      <div id="game-controls"></div>
    </div>
    <main id="shell"></main>
    <div id="connection" role="status"></div>
    <div id="toast" role="alert"></div>
    <div id="orientation">
      Gira tu dispositivo<br /><small>La mesa se disfruta en horizontal.</small>
    </div>
    <dialog id="rules">
      <div id="rules-content"></div>
      <form method="dialog">
        <button class="primary">Volver al juego</button>
      </form>
    </dialog>
    <script>
      window.ImpactPrefix = "/";
    </script>
    <script type="module" src="/games/insidia/main.js"></script>
  </body>
</html>
