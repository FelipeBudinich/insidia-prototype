<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#16151b" />
    <meta
      name="description"
      content="Insidia. Un juego de pecados y conspiraciones."
    />
    <meta property="og:title" content="INSIDIA" />
    <meta
      property="og:description"
      content="Oculta tus pecados. Confía en nadie."
    />
    <title>INSIDIA</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%2316151b'/%3E%3Cpath d='M32 8 52 32 32 56 12 32Z' stroke='%23d8ba76' stroke-width='2' fill='none'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='32' fill='%23d8ba76' font-family='serif'%3EI%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="boot" role="status"><strong>INSIDIA</strong><span id="boot-status">Preparando la mesa…</span><progress id="boot-progress" max="1" value="0" aria-label="Ilustraciones cargadas"></progress></div>
    <link rel="stylesheet" href="/games/insidia/style.css" />
    <link rel="stylesheet" href="/games/insidia/premium-interface.css" />
    <div id="stage">
      <canvas
        id="canvas"
        width="3840"
        height="2160"
        aria-label="Mesa de juego Insidia"
      ></canvas>
      <div id="game-controls"></div>
      <div
        id="game-announcer"
        class="game-accessible"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>
    </div>
    <main id="shell"></main>
    <div id="connection" role="status"></div>
    <div id="toast" role="alert"></div>
    <div id="orientation">
      Gira tu dispositivo<br /><small>La mesa se disfruta en horizontal.</small>
    </div>
    <dialog id="rules" aria-label="Cómo jugar a Insidia">
      <div id="rules-content"></div>
      <form method="dialog">
        <button class="primary">Volver al juego</button>
      </form>
    </dialog>
    <script>
      window.ImpactPrefix = "/";
    </script>
    <script type="module" src="/games/insidia/main.js"></script>
  </body>
</html>
